<style>
:root{--paper:#F7F4EE;--card:#fff;--ink:#1D1B18;--soft:#4A453E;--mute:#6B645A;--line:#E6DFD3;--accent:#A8481F;--wood:#2A2420;--wood2:#4A3E35;--cream:#F3EEE6}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 'Source Serif 4',Georgia,serif;overflow-x:clip}
a{color:var(--accent)}
.sans{font-family:'Inter Tight',system-ui,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(4vw,16px)}
header.top{padding:48px 0 8px}
h1{font:800 clamp(34px,5vw,52px)/1.05 'Inter Tight',sans-serif;letter-spacing:-.02em;margin:0 0 14px}
.intro{font-size:19px;color:var(--soft);max-width:740px;margin:0}
.search{display:flex;flex-direction:column;gap:6px;margin:22px 0 0;max-width:540px}
.search span{font:500 13px 'Inter Tight',sans-serif;color:var(--mute)}
.search input{font:inherit;font-size:17px;padding:14px 16px;border:1px solid #DDD5C8;border-radius:10px;background:#fff}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.label{font:700 14px 'Inter Tight',sans-serif;letter-spacing:.06em;color:var(--accent);margin:0 0 14px}
section{padding:36px 0 8px}
.cover{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#222}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.mosaic{display:grid;grid-template-columns:1fr 1fr}
.cover.mosaic img{aspect-ratio:1}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .15s}
.card:hover{transform:translateY(-2px)}
.card .cv{padding:10px 10px 0}
.card .tx{padding:12px 14px 16px;display:flex;flex-direction:column;gap:5px}
.meta{font:500 12px 'Inter Tight',sans-serif;color:var(--mute)}
.ttl{font:700 16px/1.25 'Inter Tight',sans-serif}
.dsc{font-size:14px;line-height:1.45;color:var(--soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.chip{align-self:flex-start;font:500 11px 'Inter Tight',sans-serif;padding:3px 9px;border:1px solid #E2B9A4;color:#8E3C19;border-radius:20px}
.top5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
@media(max-width:900px){.top5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.top5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.crates{background:var(--wood);color:var(--cream);margin-top:36px;padding:44px 0 30px}
.crates .label{color:#E7A27C}
.crates h2{font:800 clamp(28px,4vw,40px)/1.05 'Inter Tight',sans-serif;margin:0 0 8px}
.crates p.sub{color:#CFC6B8;margin:0 0 26px;max-width:680px}
.shelf{margin-bottom:30px}
.shelf-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin-bottom:12px}
.shelf-h h3{font:800 22px 'Inter Tight',sans-serif;margin:0}
.shelf-h span{font:500 14px 'Inter Tight',sans-serif;color:#B3A998}
.rowwrap{position:relative}
.row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:14px;border-bottom:10px solid var(--wood2);scrollbar-width:thin}
.row a{flex:0 0 150px;scroll-snap-align:start;color:inherit;text-decoration:none;display:flex;flex-direction:column;gap:6px}
.row a .meta{color:#CFC6B8}
.row a:focus-visible,.card:focus-visible,button:focus-visible{outline:2px solid #E7A27C;outline-offset:2px}
.nav{position:absolute;top:58px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(243,238,230,.92);color:var(--wood);font:700 18px 'Inter Tight',sans-serif;cursor:pointer}
.nav.l{left:-8px}.nav.r{right:-8px}
@media(max-width:700px){.nav{display:none}}
.tabs{display:flex;flex-wrap:wrap;gap:6px 26px;border-bottom:1px solid #DDD5C8;margin-bottom:18px}
.tabs button{background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-1px;padding:8px 0 12px;text-align:left;cursor:pointer;color:var(--ink);opacity:.6}
.tabs button[aria-selected=true]{border-color:var(--accent);opacity:1}
.tabs b{display:block;font:700 20px 'Inter Tight',sans-serif}
.tabs small{font:500 13px 'Inter Tight',sans-serif;color:var(--mute)}
.groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media(max-width:900px){.groups{grid-template-columns:repeat(2,minmax(0,1fr))}}
.group{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:10px;font:inherit}
.group[aria-pressed=true]{border:2px solid var(--accent);padding:11px}
.group .three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.group b{font:700 18px 'Inter Tight',sans-serif}
.listhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:10px;margin:30px 0 16px}
.listhead h2{font:800 28px 'Inter Tight',sans-serif;margin:0}
.btn{font:500 14px 'Inter Tight',sans-serif;background:none;border:1px solid #DDD5C8;border-radius:20px;padding:8px 16px;cursor:pointer;color:var(--ink);text-decoration:none;min-height:40px;display:inline-flex;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.empty{color:var(--mute);font-style:italic}
footer{border-top:1px solid #DDD5C8;margin-top:48px;padding:20px 0 40px;font:500 13px 'Inter Tight',sans-serif;color:var(--mute);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
.sitebar{background:#fff;border-bottom:1px solid var(--line)}
.sitebar .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;padding-top:14px;padding-bottom:14px}
.sitebar img{height:34px;width:auto;display:block}
.sitebar nav{display:flex;flex-wrap:wrap;gap:6px 22px;font:500 15px 'Inter Tight',sans-serif}
.sitebar nav a{color:var(--ink);text-decoration:none;padding:6px 0}
.sitebar nav a[aria-current]{color:var(--accent);border-bottom:2px solid var(--accent)}
.pl .sitebar{background:#141311;border-color:#2a2724}.pl .sitebar nav a{color:var(--cream)}

header.top{padding:26px 0 4px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 32px}
header.top h1{font-size:clamp(30px,4vw,42px);margin:0 0 6px}
header.top .intro{font-size:17px;margin:0}
.search{margin:0;flex:0 1 420px}
.sitebar .wrap{padding-top:10px;padding-bottom:10px}
.sitebar img{height:28px}
section{padding:22px 0 6px}
.strip{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}
.strip .card{flex:0 0 210px;scroll-snap-align:start}
.shelf{margin-bottom:52px}
.shelf:last-child{margin-bottom:10px}
.crates{margin-top:30px}
.picked{margin-top:22px}
/* playlist page */
.pl{background:#141311;color:var(--cream);min-height:100vh}
.pl .back{color:#E7A27C;font:700 15px 'Inter Tight',sans-serif;text-decoration:none}
.pl-top{display:flex;flex-wrap:wrap;gap:36px;align-items:flex-start;padding:28px 0 36px}
.pl-cv{flex:0 1 380px;min-width:240px}
.pl-tx{flex:1 1 440px;display:flex;flex-direction:column;gap:14px}
.pl-tx h1{color:#fff}
.pl-tx .meta{color:#B3A998;font-size:14px}
.pl-tx p{color:#CFC6B8;font-size:19px;margin:0}
.pl-tx .chip{border-color:#4A463F;color:var(--cream)}
.player{width:100%;height:352px;border:0;border-radius:12px}
.quote{border-left:0;margin:6px 0 0;padding:18px 20px;background:#1E1C19;border-radius:12px;font-style:italic;color:#E9E2D6}
.pl h2{font:800 22px 'Inter Tight',sans-serif;margin:0 0 14px}
.near{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;padding-bottom:60px}
@media(max-width:900px){.near{grid-template-columns:repeat(3,minmax(0,1fr))}}
.near a{color:inherit;text-decoration:none;display:flex;flex-direction:column;gap:6px}
.near .meta{color:#B3A998}
.surprise{background:#E7A27C;color:#141311;border:none;border-radius:24px;padding:12px 20px;font:700 15px 'Inter Tight',sans-serif;cursor:pointer}
/* list page */
table{width:100%;border-collapse:collapse;font:14px 'Inter Tight',sans-serif;background:#fff}
th{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}
th button{background:none;border:none;font:700 13px 'Inter Tight',sans-serif;color:var(--mute);cursor:pointer;padding:6px 0}
th button[aria-sort]{color:var(--accent)}
td{padding:6px 10px;border-bottom:1px solid #F0EBE2;color:var(--soft)}
td.n{text-align:right;white-space:nowrap}
td a{color:var(--ink);font-weight:700;text-decoration:none}
.tbox{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.thumb{width:40px}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
.arts{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 8px}.arts>a,.arts>span{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:1px solid rgba(255,255,255,.18);border-radius:10px;text-decoration:none;color:inherit;font-family:'Inter Tight',sans-serif}.arts>a:hover{border-color:#E7A27C}.arts .meta{font-size:12px}
</style>
</head>

<script>
{
const app = document.getElementById('app');
let D = [];
const state = { tab: 'style', sel: null, q: '', sortBy: 'sort', dir: -1 };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sp = id => 'https://open.spotify.com/playlist/' + encodeURIComponent(id);
const cover = p => '<div class="cover"><img loading="lazy" alt="Cover of ' + esc(p.title) + '" src="' + esc('covers/' + p.id + '.jpg') + '" onerror="this.onerror=null;this.src=\'covers/' + esc(p.id) + '.jpg\'"></div>';
const meta = p => esc(p.date) + ' · ' + p.songs + ' songs' + (p.saves ? ' · ' + p.saves + ' saves' : '');
const card = p => '<a class="card" href="#p-' + esc(p.id) + '"><div class="cv">' + cover(p) + '</div><div class="tx"><span class="meta">' + meta(p) + '</span><span class="ttl">' + esc(p.title) + '</span>' + (p.desc ? '<span class="dsc">' + esc(p.desc) + '</span>' : '') + '<span class="chip">' + esc(p.style) + '</span></div></a>';

const SERIES = [
  ['Deep House Grooves', 'Deep House Grooves'],
  ['Tabasco Chillout Lounge', 'Tabasco Chillout Lounge'],
  ['GG All Stars', 'GG All Stars · nights at Tribu'],
  ['Tabasco', 'Tabasco specials'],
  ['Funky Grooves', 'Funky Grooves'],
  ['Live sets', 'Live sets'],
  ['Singles', 'One-offs']
];
const BAR = '<div class="sitebar"><div class="wrap"><a href="https://robingood.com/" aria-label="Robin Good homepage"><img src="assets/wordmark.svg" alt="Robin Good"></a><nav aria-label="Main navigation"><a href="https://robingood.com/key-ideas/">Key Ideas</a><a href="https://robingood.com/interviews-talks-presentations/">Interviews &amp; Presentations</a><a href="https://robingood.com/tools/">Tools</a><a href="#" aria-current="page">Music</a></nav></div></div>';
const TABS = [
  ['style', 'Style', 'what it sounds like'],
  ['artist', 'Artists', 'the 40 I play most']
];
let AR = { top: [], map: {}, pl: {} };
const val = (p, k) => k === 'year' ? String(Math.floor(p.sort / 100)) : (p[k] || 'No special place');

function home() {
  const q = state.q.trim().toLowerCase();
  const byDate = (a, b) => b.sort - a.sort;
  const found = q ? D.filter(p => (p.title + ' ' + p.desc + ' ' + p.place + ' ' + p.style + ' ' + p.series).toLowerCase().includes(q)).sort(byDate) : [];
  const top = [...D].sort((a, b) => b.saves - a.saves).slice(0, 10);
  const shelves = SERIES.map(([k, name]) => {
    const items = D.filter(p => p.series === k).sort((a, b) => (a.num && b.num) ? a.num - b.num : a.sort - b.sort);
    if (!items.length) return '';
    const s = [...items].sort((a, b) => a.sort - b.sort);
    const span = s[0].date === s[s.length - 1].date ? s[0].date : s[0].date + ' to ' + s[s.length - 1].date;
    return '<div class="shelf"><div class="shelf-h"><h3>' + esc(name) + '</h3><span>' + items.length + ' playlists · ' + esc(span) + '</span></div><div class="rowwrap"><div class="row" tabindex="0" aria-label="' + esc(name) + '">' +
      items.map(p => '<a href="#p-' + esc(p.id) + '" title="' + esc(p.title) + '">' + cover(p) + '<span class="meta">' + esc(p.date) + ' · ' + p.songs + ' songs</span></a>').join('') +
      '</div><button class="nav l" aria-label="Scroll left">‹</button><button class="nav r" aria-label="Scroll right">›</button></div></div>';
  }).join('');
  const map = {};
  if (state.tab === 'artist') AR.top.forEach(a => { map[a] = AR.map[a].map(id => D.find(x => x.id === id)).filter(Boolean); });
  else D.forEach(p => { const v = val(p, state.tab); (map[v] = map[v] || []).push(p); });
  let keys = Object.keys(map);
  keys.sort(state.tab === 'year' ? (a, b) => a - b : (a, b) => map[b].length - map[a].length);
  const groups = keys.map(k => '<button class="group" data-g="' + esc(k) + '" aria-pressed="' + (state.sel === k) + '"><div class="three">' +
    [...map[k]].sort((a, b) => b.saves - a.saves).slice(0, 3).map(cover).join('') + '</div><b>' + esc(k) + '</b><span class="meta">' + map[k].length + (map[k].length === 1 ? ' playlist' : ' playlists') + '</span></button>').join('');
  const picked = state.sel == null ? [] : state.tab === 'artist' ? (AR.map[state.sel] || []).map(id => D.find(x => x.id === id)).filter(Boolean).sort(byDate) : D.filter(p => val(p, state.tab) === state.sel).sort(byDate);
  app.innerHTML = BAR +
    '<div class="wrap"><header class="top"><div><h1>GG-DJ Music Archive</h1><p class="intro">GG-DJ is my name when I play music. These are all the Spotify playlists I made since 2020.</p></div>' +
    '<label class="search"><span>Search the archive</span><input id="q" type="search" value="' + esc(state.q) + '" placeholder="A title, a place, a word like sunset"></label></header>' +
    (q
      ? '<section><div class="listhead" style="margin-top:0"><h2>Search results</h2><div style="display:flex;gap:10px;align-items:center"><button class="btn" id="clear">Clear</button><span class="meta">' + found.length + ' of ' + D.length + '</span></div></div>' + (found.length ? '<div class="grid">' + found.map(card).join('') + '</div>' : '<p class="empty">Nothing found. Try another word.</p>') + '</section>'
      : '<section><p class="label">START HERE · THE MOST SAVED</p><div class="strip">' + top.map(card).join('') + '</div></section>') +
    '<section><p class="label">BROWSE BY</p><div class="tabs" role="tablist">' +
    TABS.map(([k, n, s]) => '<button role="tab" data-t="' + k + '" aria-selected="' + (state.tab === k) + '"><b>' + n + '</b><small>' + s + '</small></button>').join('') +
    '</div><div class="groups">' + groups + '</div>' +
    (state.sel != null ? '<div class="picked" id="picked"><div class="listhead" style="margin-top:0"><h2>' + esc(state.sel) + '</h2><div style="display:flex;gap:10px;align-items:center"><button class="btn" id="close">Close</button><span class="meta">' + picked.length + (picked.length === 1 ? ' playlist' : ' playlists') + ' · newest first</span></div></div><div class="grid">' + picked.map(card).join('') + '</div></div>' : '') +
    '</section></div>' +
    '<div class="crates"><div class="wrap"><h2>Playlist series</h2><p class="sub">Each row is one series, in the order I made them. Slide sideways to see them all.</p>' + shelves + '</div></div>' +
    '<div class="wrap"><section><div class="listhead"><h2>All ' + D.length + ' playlists</h2><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><a class="btn" href="#list">See them as a list</a><span class="meta">newest first</span></div></div>' +
    '<div class="grid">' + [...D].sort(byDate).map(card).join('') + '</div>' +
    '</section><footer><span>GG-DJ Music Archive · Robin Good</span><span>Every cover opens its playlist page, where you can play it.</span></footer></div>';
  const qi = document.getElementById('q');
  qi.addEventListener('input', e => { state.q = e.target.value; const pos = e.target.selectionStart; home(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); });
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { state.tab = b.dataset.t; state.sel = null; home(); });
  app.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { state.sel = state.sel === b.dataset.g ? null : b.dataset.g; home(); const pk = document.getElementById('picked'); if (pk) pk.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  const c = document.getElementById('clear'); if (c) c.onclick = () => { state.q = ''; home(); };
  const cl = document.getElementById('close'); if (cl) cl.onclick = () => { state.sel = null; home(); };
  app.querySelectorAll('.rowwrap').forEach(w => { const r = w.querySelector('.row'); w.querySelector('.l').onclick = () => r.scrollBy({ left: -480, behavior: 'smooth' }); w.querySelector('.r').onclick = () => r.scrollBy({ left: 480, behavior: 'smooth' }); });
}

function page(id) {
  const p = D.find(x => x.id === id);
  if (!p) { location.hash = ''; return; }
  const score = x => (x.style === p.style ? 2 : 0) + (x.series === p.series ? 1 : 0) + (x.place && x.place === p.place ? 1 : 0);
  const near = D.filter(x => x.id !== p.id).sort((a, b) => score(b) - score(a) || b.saves - a.saves).slice(0, 6);
  app.innerHTML = '<div class="pl">' + BAR + '<div class="wrap"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:28px"><a class="back" href="#">← GG DJ · Music Archive</a><button class="surprise" id="sur">Surprise me</button></div>' +
    '<div class="pl-top"><div class="pl-cv">' + cover(p) + '</div><div class="pl-tx"><span class="meta">' + meta(p) + (p.place ? ' · ' + esc(p.place) : '') + '</span><h1>' + esc(p.title) + '</h1>' +
    (p.desc ? '<p>' + esc(p.desc) + '</p>' : '') + '<div style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip">' + esc(p.style) + '</span><span class="chip">' + esc(p.series === 'Singles' ? 'One-off' : p.series) + '</span></div>' +
    '<iframe class="player" title="Spotify player for ' + esc(p.title) + '" src="https://open.spotify.com/embed/playlist/' + encodeURIComponent(p.id) + '?theme=0" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>' +
    '<a href="' + sp(p.id) + '" style="color:#E7A27C;font:700 15px Inter Tight,sans-serif">Open in Spotify</a></div></div>' +
    ((AR.pl[p.id] || []).length ? '<h2>Artists in this one</h2><div class="arts">' + AR.pl[p.id].map(a => { const n = (AR.map[a] || [p.id]).length; return n > 1 ? '<a href="#a-' + encodeURIComponent(a) + '"><b>' + esc(a) + '</b><span class="meta">also in ' + (n - 1) + (n === 2 ? ' other playlist' : ' other playlists') + '</span></a>' : '<span><b>' + esc(a) + '</b><span class="meta">only here</span></span>'; }).join('') + '</div>' : '') +
    '<h2>If you like this one</h2><div class="near">' + near.map(x => '<a href="#p-' + esc(x.id) + '">' + cover(x) + '<span class="ttl" style="font-size:13px">' + esc(x.title) + '</span><span class="meta">' + esc(x.style) + '</span></a>').join('') + '</div></div></div>';
  document.getElementById('sur').onclick = () => { const r = D[Math.floor(Math.random() * D.length)]; location.hash = 'p-' + r.id; };
  window.scrollTo(0, 0);
}

function listPage() {
  const C = [['title', 'Playlist'], ['style', 'Style'], ['series', 'Series'], ['place', 'Place'], ['sort', 'Made'], ['songs', 'Songs'], ['saves', 'Saves']];
  const rows = [...D].sort((a, b) => { const A = a[state.sortBy] ?? '', B = b[state.sortBy] ?? ''; return (A > B ? 1 : A < B ? -1 : 0) * state.dir; });
  app.innerHTML = BAR + '<div class="wrap"><header class="top"><a href="#" class="sans" style="font-weight:700;text-decoration:none">← Back to the archive</a><h1 style="margin-top:18px">All ' + D.length + ' playlists in one table</h1><p class="intro">Click a column name to sort.</p></header>' +
    '<div class="tbox"><table><thead><tr><th class="thumb"></th>' + C.map(([k, l]) => '<th><button data-s="' + k + '"' + (state.sortBy === k ? ' aria-sort="' + (state.dir > 0 ? 'ascending' : 'descending') + '"' : '') + '>' + l + (state.sortBy === k ? (state.dir > 0 ? ' ↑' : ' ↓') : '') + '</button></th>').join('') + '</tr></thead><tbody>' +
    rows.map(p => '<tr><td><div class="thumb">' + cover(p) + '</div></td><td><a href="#p-' + esc(p.id) + '">' + esc(p.title) + '</a></td><td>' + esc(p.style) + '</td><td>' + esc(p.series) + '</td><td>' + esc(p.place) + '</td><td class="n">' + esc(p.date) + '</td><td class="n">' + p.songs + '</td><td class="n">' + p.saves + '</td></tr>').join('') +
    '</tbody></table></div><footer><span>GG DJ · Robin Good</span></footer></div>';
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { const k = b.dataset.s; state.dir = state.sortBy === k ? -state.dir : (['title', 'style', 'series', 'place'].includes(k) ? 1 : -1); state.sortBy = k; listPage(); });
  window.scrollTo(0, 0);
}

function route() {
  const h = location.hash.slice(1);
  if (h.startsWith('a-')) { state.tab = 'artist'; state.sel = decodeURIComponent(h.slice(2)); state.q = ''; home(); const pk = document.getElementById('picked'); if (pk) setTimeout(() => pk.scrollIntoView({ block: 'start' }), 50); }
  else if (h.startsWith('p-')) page(h.slice(2));
  else if (h === 'list') listPage();
  else home();
}
window.addEventListener('hashchange', route);
D = JSON.parse(document.getElementById('data').textContent); AR = JSON.parse(document.getElementById('artists').textContent); route();
}
</script>
</body>
</html>
